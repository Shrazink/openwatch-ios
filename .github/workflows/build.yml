name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar projeto Xcode
        run: brew install xcodegen && xcodegen generate
      - name: Compilar sem assinatura
        run: |
          xcodebuild -project OpenWatch.xcodeproj -scheme OpenWatch \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Empacotar .ipa
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/OpenWatch.app Payload/
          zip -r OpenWatch.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWatch-ipa
          path: OpenWatch.ipa
